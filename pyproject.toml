[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repoglance"
version = "0.5.0"
description = "Instant, gorgeous insight into any code repository — languages, complexity hotspots, TODOs and git activity in one terminal command."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "repoglance contributors" }]
keywords = ["cli", "code-analysis", "loc", "cloc", "complexity", "git", "developer-tools", "terminal", "rich"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "rich>=13.0",
    "click>=8.0",
    "lizard>=1.17",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/SRJ-ai/repoglance"
Repository = "https://github.com/SRJ-ai/repoglance"
Issues = "https://github.com/SRJ-ai/repoglance/issues"

[project.scripts]
repoglance = "repoglance.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/repoglance"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM"]
ignore = ["E501", "SIM105", "B008"]
