name: "Repoglance Repo Insight"
description: "Analyze a repository and (optionally) post a repoglance report as a PR comment or gate the build."
branding:
  icon: "search"
  color: "blue"

inputs:
  path:
    description: "Directory to analyze."
    required: false
    default: "."
  comment:
    description: "Post the Markdown report as a sticky PR comment (requires pull_request event and a token with pull-requests: write)."
    required: false
    default: "true"
  fail-under:
    description: "Fail the job if the health score is below this value (0-100). Empty to disable."
    required: false
    default: ""
  max-complexity:
    description: "Fail the job if any function exceeds this cyclomatic complexity. Empty to disable."
    required: false
    default: ""
  sarif:
    description: "Generate SARIF and upload it to GitHub code scanning (requires security-events: write)."
    required: false
    default: "false"
  diff-base:
    description: "Only analyze files changed since this git ref (e.g. origin/main). Empty = whole repo."
    required: false
    default: ""
  annotations:
    description: "Create a Check Run with inline complexity annotations on the PR (requires checks: write)."
    required: false
    default: "false"
  annotation-threshold:
    description: "Minimum complexity to annotate inline."
    required: false
    default: "15"
  github-token:
    description: "Token used to post the PR comment."
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install repoglance
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"

    - name: Job summary + Markdown report
      shell: bash
      run: |
        since=""
        [ -n "${{ inputs.diff-base }}" ] && since="--since ${{ inputs.diff-base }}"
        repoglance "${{ inputs.path }}" $since --md > "$RUNNER_TEMP/repoglance.md"
        cat "$RUNNER_TEMP/repoglance.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Generate SARIF
      if: ${{ inputs.sarif == 'true' }}
      shell: bash
      run: repoglance "${{ inputs.path }}" --sarif > "$RUNNER_TEMP/repoglance.sarif"

    - name: Upload SARIF
      if: ${{ inputs.sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ runner.temp }}/repoglance.sarif

    - name: Comment on PR
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        # Sticky comment: edit the existing repoglance comment if present, else create.
        marker="<!-- repoglance -->"
        body="$marker"$'\n'"$(cat "$RUNNER_TEMP/repoglance.md")"
        pr="${{ github.event.pull_request.number }}"
        existing=$(gh api "repos/${{ github.repository }}/issues/$pr/comments" \
          --jq "[.[] | select(.body | startswith(\"$marker\"))][0].id" 2>/dev/null || echo "")
        if [ -n "$existing" ] && [ "$existing" != "null" ]; then
          gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" -f body="$body" >/dev/null
        else
          gh api -X POST "repos/${{ github.repository }}/issues/$pr/comments" -f body="$body" >/dev/null
        fi

    - name: Inline annotations (Check Run)
      if: ${{ inputs.annotations == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        repoglance "${{ inputs.path }}" --json > "$RUNNER_TEMP/repoglance.json"
        python - "$RUNNER_TEMP/repoglance.json" "${{ inputs.annotation-threshold }}" <<'PY' > "$RUNNER_TEMP/checkrun.json"
        import json, sys
        report = json.load(open(sys.argv[1]))
        threshold = int(sys.argv[2])
        anns = []
        for h in report.get("hotspots", []):
            if h["complexity"] < threshold:
                continue
            anns.append({
                "path": h["path"],
                "start_line": max(1, h["line"]),
                "end_line": max(1, h["line"]),
                "annotation_level": "failure" if h["complexity"] >= 25 else "warning",
                "message": f"Function '{h['name']}' has cyclomatic complexity {h['complexity']}.",
                "title": "High complexity",
            })
        health = report.get("health", {})
        out = {
            "name": "repoglance",
            "head_sha": "__SHA__",
            "status": "completed",
            "conclusion": "neutral",
            "output": {
                "title": f"Health {health.get('score','?')}/100 ({health.get('grade','?')})",
                "summary": f"{len(anns)} complexity hotspot(s) at or above {threshold}.",
                "annotations": anns[:50],
            },
        }
        print(json.dumps(out))
        PY
        sha="${{ github.event.pull_request.head.sha || github.sha }}"
        sed -i "s/__SHA__/$sha/" "$RUNNER_TEMP/checkrun.json"
        gh api -X POST "repos/${{ github.repository }}/check-runs" --input "$RUNNER_TEMP/checkrun.json" >/dev/null || true

    - name: Gate
      shell: bash
      run: |
        args=""
        [ -n "${{ inputs.fail-under }}" ] && args="$args --fail-under ${{ inputs.fail-under }}"
        [ -n "${{ inputs.max-complexity }}" ] && args="$args --max-complexity ${{ inputs.max-complexity }}"
        if [ -n "$args" ]; then
          repoglance "${{ inputs.path }}" --ci $args
        fi
